name: github-action

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

env:
  # renovate: depName=nodejs/node
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node ${{env.NODE_VERSION}}
        uses: actions/setup-node@v3
        with:
          node-version: ${{env.NODE_VERSION}}

      - name: install
        run: |
             npm install
             npm install -g yarn
             npm install -g vsce

      - name: lint
        run: |
          set +e
          npx eslint . 2>&1 | tee /tmp/eslint-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            msg=$( (head -c 500 /tmp/eslint-output.log; tail -c 500 /tmp/eslint-output.log) | awk '{printf "%s%%0A", $0}' | head -c 900 )
            echo "::error title=eslint exit $status::${msg}"
            exit "$status"
          fi

      - name: static code analysis
        run: npm run code-analysis

      - name: test
        uses: GabrielBB/xvfb-action@v1
        with:
          run: npm run coverage

      - name: Report test coverage to Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
