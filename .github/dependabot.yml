version: 2
updates:
  # keep npm dependencies fresh
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # only safe semver updates are merged automatically,
    # major updates stay manual
    auto-merge:
      - update-type: "semver:patch"
      - update-type: "semver:minor"

  # keep github actions fresh
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    auto-merge:
      - update-type: "semver:patch"
      - update-type: "semver:minor"
